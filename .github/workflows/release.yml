name: release
on:
  push: { tags: ['v*'] }
permissions:
  contents: write       # GitHub release
  id-token: write       # OIDC: provenance signing
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }
      - run: composer validate --no-check-publish && composer install --no-interaction --no-progress
      # The release artifact is the exact tagged source tree; provenance ties it to this workflow run.
      - run: git archive --format=tar.gz --prefix="${{ github.event.repository.name }}-${{ github.ref_name }}/" -o "${{ github.event.repository.name }}-${{ github.ref_name }}.tar.gz" "${{ github.ref_name }}"
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: '*.tar.gz' }
      - uses: softprops/action-gh-release@v2
        with: { files: '*.tar.gz' }
